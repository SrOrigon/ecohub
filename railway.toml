[build]
builder = "NIXPACKS"
buildCommand = "npm run build"
watchPatterns = [
  "src/**",
  "public/**",
  "prisma/**",
  "scripts/**",
  "package.json",
  "package-lock.json",
  "next.config.ts",
  "railway.toml",
  "nixpacks.toml",
]

[deploy]
# Hobby: US$ 5 de crédito. Teto 1 vCPU / 1 GB (não 8/8). Sleep quando idle.
# Hard limit do painel só aceita mínimo US$ 10 — o teto real de gasto é replica limit + sleep.
startCommand = "node --max-old-space-size=384 scripts/start-production.mjs"
numReplicas = 1
sleepApplication = true
overlapSeconds = 0
drainingSeconds = 5
healthcheckPath = "/api/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.limitOverride.containers]
cpu = 1
memoryBytes = 1073741824

# Postgres no mesmo projeto: teto no painel 0.5 vCPU / 256–512 MB.
# DATABASE_URL = ${{Postgres.DATABASE_URL}} (privado). Nunca DATABASE_PUBLIC_URL.
