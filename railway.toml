[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# OBRIGATÓRIO no painel Railway:
# 1. Volume montado em /data (sem isso, logins somem a cada deploy)
# 2. ECOHUB_INSTITUTIONAL=1
# 3. DATABASE_URL=file:/data/prod.db
# 4. Uma réplica apenas (SQLite)
# 5. NÃO definir AUTH_SECRET placeholder — usar /data/.auth_secret
