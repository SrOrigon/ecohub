[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Variáveis no painel Railway (Variables):
# AUTH_SECRET          — JWT, mínimo 32 caracteres (obrigatório em produção institucional)
# DATABASE_URL         — file:/data/prod.db (monte Volume em /data)
# EDUHUB_ENABLE_DEMO   — 1 para ambiente demo público (seed automático)
# NEXT_PUBLIC_APP_URL  — URL pública do app
# PLATFORM_ADMIN_EMAILS — admins da plataforma (aprovar escolas)
