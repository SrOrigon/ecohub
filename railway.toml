[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Variáveis no painel Railway (Variables):
# AUTH_SECRET          — JWT, mínimo 32 caracteres (obrigatório em produção)
# ECOHUB_INSTITUTIONAL — 1 para modo institucional
# DATABASE_URL         — file:/data/prod.db (monte Volume em /data)
# NEXT_PUBLIC_APP_URL  — URL pública do app
# PLATFORM_ADMIN_EMAILS — admins da plataforma (aprovar escolas)
