name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          AUTH_SECRET: ci-build-secret-minimum-32-characters-long
          DATABASE_URL: file:./ci.db

      - name: Verify production start imports
        run: node --input-type=module -e "await import('./scripts/lib/db-user-count.mjs'); await import('./scripts/start-production.mjs'); console.log('start imports ok')"

      - name: Production healthcheck smoke
        run: |
          export DATABASE_URL=file:./ci.db
          export AUTH_SECRET=ci-build-secret-minimum-32-characters-long
          export NODE_ENV=production
          export ECOHUB_INSTITUTIONAL=0
          npx prisma migrate deploy
          npm start &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/health/live; then
              echo ""
              echo "health/live OK"
              exit 0
            fi
            sleep 2
          done
          echo "healthcheck smoke failed"
          exit 1
